name: Deploy Frontend to O2Switch

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
  # Triggered by Medusa subscriber (blog-build-hook) when a blog_post is
  # created/updated/deleted. The subscriber sends event_type="blog-post-changed"
  # plus a client_payload with handle / title / action.
  repository_dispatch:
    types: [blog-post-changed]

# Only one deploy at a time. A new push cancels any in-flight run so parallel
# FTP sessions don't queue on O2Switch (they were tripling total time).
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Astro
        working-directory: frontend
        env:
          PUBLIC_MEDUSA_URL: ${{ secrets.PUBLIC_MEDUSA_URL }}
          PUBLIC_MEDUSA_API_KEY: ${{ secrets.PUBLIC_MEDUSA_API_KEY }}
          PUBLIC_MEDUSA_REGION_ID: ${{ secrets.PUBLIC_MEDUSA_REGION_ID }}
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/dist/
          dangerous-clean-slate: false
          timeout: 600000
