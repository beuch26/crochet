# Magic Crochet Kit - backend Medusa
# A déployer dans /etc/nginx/sites-available/crochet-medusa-api sur le VPS Hetzner
# Symlink à créer : ln -sf /etc/nginx/sites-available/crochet-medusa-api /etc/nginx/sites-enabled/
#
# Pour activer HTTPS:
#   1. Ajouter le A-record DNS api-crochet.web-guru.fr -> 178.104.112.71
#   2. certbot --nginx -d api-crochet.web-guru.fr

server {
    listen 80;
    server_name api.magic-crochet-kit.com api-crochet.web-guru.fr;

    client_max_body_size 2G;
    client_body_timeout 1800s;

    location / {
        proxy_pass http://localhost:9100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }
}
