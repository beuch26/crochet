# Magic Crochet Kit — frontend Astro statique
# Déploie dans /etc/nginx/sites-available/crochet-frontend sur le VPS Hetzner
# Symlink : ln -sf /etc/nginx/sites-available/crochet-frontend /etc/nginx/sites-enabled/
#
# Le bloc HTTPS (listen 443 + ssl_*) est ajouté automatiquement par certbot.
# Lancer certbot --nginx -d magic-crochet-kit.com -d www.magic-crochet-kit.com
# pour émettre les certs et patcher le vhost.

server {
    listen 80;
    server_name magic-crochet-kit.com www.magic-crochet-kit.com;

    root /opt/magic-crochet-medusa/frontend-dist;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache long sur les assets fingerprintés Astro
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
